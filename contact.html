<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Cao Minh Nguyet</title>

    <style>

        /* PAGE BACKGROUND */
        body {
            margin: 0;
            background-color: #f8f5fa;
        }


        /* PAGE TITLE */
        .contact {
            width: 100%;
            text-align: center;
        }

        .contact h1 {
            font-size: 80px;
            font-family: 'Courier New', Courier, monospace;

            color: #71A2D9;

            margin: 40px 0 80px;

            font-weight: bold;
            letter-spacing: 3px;
        }


        /* CONTACT CARD */
        .contact-card {
            width: 85%;
            max-width: 960px;
            min-height: 400px;

            margin: 0 auto;

            background-color: white;

            border: 2px solid #71A2D9;
            border-radius: 25px;

            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);

            padding: 55px 70px;

            box-sizing: border-box;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }


        /* INTRODUCTION */
        .contact-card p:first-child {
            font-family: Arial, sans-serif;

            font-size: 22px;
            line-height: 1.6;

            color: #333;

            text-align: center;

            margin: 0 0 35px;
        }


        /* CONTACT INFORMATION */
        .contact-card p:not(:first-child) {
            font-family: Arial, sans-serif;

            font-size: 25px;

            color: #222;

            margin: 8px auto;

            width: 520px;

            text-align: left;
        }


        /* CONTACT LABEL */
        .contact-card strong {
            display: inline-block;

            width: 120px;

            color: #71A2D9;

            font-weight: bold;

            margin-right: 5px;
        }


        /* CONTACT VALUE */
        .contact-card span {
            color: #222;
        }


        /* RESPONSIVE */
        @media (max-width: 768px) {

            .contact h1 {
                font-size: 55px;
                margin-bottom: 50px;
            }

            .contact-card {
                width: 90%;
                padding: 40px 25px;
            }

            .contact-card p:first-child {
                font-size: 18px;
            }

            .contact-card p:not(:first-child) {
                width: 100%;
                font-size: 20px;
            }

            .contact-card strong {
                width: 95px;
            }
        }

    </style>
</head>


<body>

    <section class="contact">

        <h1>Contact Me</h1>

    </section>


    <div class="contact-card">

        <p>
            Thank you for visiting my portfolio.
            <br>
            Feel free to contact me.
        </p>

        <p>
            <strong>Mail:</strong>
            <span>minhminofficial@gmail.com</span>
        </p>

        <p>
            <strong>Phone:</strong>
            <span>+84 373 158 868</span>
        </p>

    </div>

</body>
</html>
